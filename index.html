<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal & Off-Page Connector Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .split-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
      padding: 16px;
      overflow: hidden;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .field-group {
      margin-bottom: 12px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #888888);
      margin-bottom: 5px;
    }
    .field-group input, .field-group select {
      width: 100%;
      background: var(--surface-bg, #121212);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 4px;
      color: var(--text-bright, #f4f4f5);
      padding: 7px 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
    .status-badge.paired {
      background: rgba(74, 222, 128, 0.15);
      color: #4ADE80;
      border: 1px solid #4ADE80;
    }
    .status-badge.dangling {
      background: rgba(239, 68, 68, 0.15);
      color: #EF4444;
      border: 1px solid #EF4444;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      border-radius: 6px;
      border: 1px solid var(--border-color, #2c2c2c);
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 6px;
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🌀</span>
      <span class="window-text">Portal & Off-Page Connector Buddy</span>
      <span id="block-tag" class="block-tag">PORTAL BLOCK</span>
    </div>
    <div class="window-actions">
      <span id="status-badge" class="status-badge paired">PAIRED</span>
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- Properties sidebar -->
    <div class="panel">
      <div class="panel-header">
        <span>Portal Reference Specs</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <label>Portal Identifier Tag</label>
          <input type="text" id="prop-portalTag" value="PORTAL-MAIN-OUT">
        </div>
        <div class="field-group">
          <label>Descriptive Label</label>
          <input type="text" id="prop-label" value="Cross-Sheet Master Bus">
        </div>
        <div class="field-group">
          <label>Portal Flow Direction</label>
          <select id="prop-direction">
            <option value="Source">Source (Out-Sheet / Transmit)</option>
            <option value="Destination">Destination (In-Sheet / Receive)</option>
            <option value="Bidirectional">Bidirectional</option>
          </select>
        </div>
        <div class="field-group">
          <label>Symbol Geometry Style</label>
          <select id="prop-shape">
            <option value="Chevron Arrow">Chevron Arrow</option>
            <option value="Hexagon">Hexagon</option>
            <option value="Flag">Flag</option>
          </select>
        </div>
        <div class="field-group">
          <label>Source Sheet & Zone</label>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
            <input type="text" id="prop-sourceSheet" value="SHEET-01">
            <input type="text" id="prop-sourceZone" value="C-4">
          </div>
        </div>
        <div class="field-group">
          <label>Target Sheet & Zone</label>
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
            <input type="text" id="prop-targetSheet" value="SHEET-02">
            <input type="text" id="prop-targetZone" value="A-1">
          </div>
        </div>
        <div class="field-group">
          <label>Target Companion Portal Tag</label>
          <input type="text" id="prop-targetTag" value="PORTAL-AMP-IN">
        </div>
        <div class="field-group">
          <label>Signal Payload Type</label>
          <input type="text" id="prop-signal" value="Dante Audio 64-Ch Multicast">
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="panel">
      <div class="panel-header">
        <span>Off-Page Link Status & Channel Bundle</span>
        <button id="btn-add-ch" class="btn-action btn-small">+ Add Bundled Channel</button>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="portal-svg" class="svg-viewport"></div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Bundled Signal Channels / Sub-Carriers</div>
        <div class="table-container">
          <div id="channels-table"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/portalApp.js"></script>
</body>
</html>
