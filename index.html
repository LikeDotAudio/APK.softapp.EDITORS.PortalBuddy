<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal & Off-Page Connector Buddy — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 12px; margin-bottom: 20px; }
    .card { background: #171d27; border: 1px solid #283348; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:20px;">🌀</span>
      <h2>Portal & Off-Page Connector Buddy</h2>
    </div>
    <button id="btn-export">Export Portal Links</button>
  </header>

  <div class="card">
    <div style="font-size:16px; font-weight:700; color:#38bdf8;">PORTAL: PORTAL-MAIN-OUT</div>
    <div style="font-size:13px; color:#94a3b8; margin-top:6px;">Target Sheet: <b>SHEET-02 (AMP ROOM)</b> &rarr; Receiving Portal: <b>PORTAL-AMP-IN</b></div>
    <div style="font-size:12px; color:#34d399; margin-top:6px;">● Status: Paired & Validated (Zero Collision)</div>
  </div>

  <script type="module">
    import { PortalLinkModel } from './js/portalApp.js';
    const model = new PortalLinkModel();
    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${model.portalTag}.json`;
      a.click();
    });
  </script>
</body>
</html>
